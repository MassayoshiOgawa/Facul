<!DOCTYPE html>

<html lag="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>JavaScript</title>
    <script src="js/valproc.js" defer></script>
    <style>
        section {
            margin-top: 0px auto;
        }

        .cadnumint {
            width: 300px;
            margin: 0px auto;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .cadnumint input {
            margin: 5px auto;
            width: 100%;
            padding: 5px 0;
        }

        .cadnumint button {
            width: 30%;
            margin: 0 10%;
            background-color: #b1ccf5;
            font-weight: bold;
            font-size: 16px;
        }

        label {
            float: left;
        }

        h2 {
            text-align: center;
            margin-top: 0px;
            margin-bottom: 10px;
            font-size: 50px;
        }
    </style>
</head>

<body>
    <section>
        <h2>Síndico Studiare Molto</h2>
        <font face="arial">
            <form name="frmnumint" action="#" method="get" onsubmit="return validaFormulario()">
                <fieldset class="cadnumint">
                    <legend> Cadastro de Famílias </legend>
                    <br>
                    <label for="num1"> Sobrenome: </label>
                    <input type="text" name="num1" id="num1">
                    <br>
                    <label for="num2"> Apartamento: </label>
                    <input type="text" name="num2" id="num2">
                    <br>
                    <label for="op"> Moradores: </label>
                    <input type="text" name="op" id="op">
                    <br>
                    <label for="num3"> Renda: </label>
                    <input type="text" name="num3" id="num3">
                    <br><br>
                    <button type="reset">limpar</button><button type="submit">Enviar</button>
                </fieldset>
            </form>
        </font>
    </section>
</body>

</html>
