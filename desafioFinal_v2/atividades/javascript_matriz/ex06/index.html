<!DOCTYPE html>

<html lag="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>JavaScript</title>
    <script src="js/valproc.js" defer></script>
    <style>
        /*Configurações gerais*/

        section {
            margin-top: 0px auto;
        }

        /*Configurações da página*/

        .cadnumint {

            width: 300px;
            margin: 0px auto;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .cadnumint input {

            margin: 5px auto;
            width: 100%;
            padding: 5px 0;
        }

        .cadnumint button {

            width: 30%;
            margin: 0 10%;
            background-color: #b1ccf5;
            font-weight: bold;
            font-size: 16px;
        }

        label {

            float: left;
        }

        h2 {

            text-align: center;
            margin-top: 0px;
            margin-bottom: 10px;
            font-size: 50px;
        }
    </style>
</head>

<body>
    <section>

        <h2>Atividade</h2>
        <font face="arial">

            <form name="frmnumint" action="#" method="get" onsubmit="return validaFormulario()">

                <fieldset class="cadnumint">

                    <legend> Entrada de dados</legend>
                    <br>
                    <p>Aperte em "Enviar" para cadastrar os 3 clientes e as compras dos 3 últimos meses. Depois escolha uma opção do menu para ver o resultado no console.</p>
                    <br>
                    <div style="text-align: center;">
                        <label for="num1"> Nome do cliente para consulta: </label>
                        <input type="text" name="num1" id="num1">
                    </div>
                    <br>
                    <div style="display: flex; justify-content: center; align-items: center; gap: 5px;">
                        <p>Menu:</p>
                        <select name="options" id="options">
                            <option value="">Selecione</option>
                            <option value="op3">Adicionar clientes</option>
                            <option value="op1">Ver compras de um cliente</option>
                            <option value="op2">Ver todas as compras de todos os clientes</option>
                        </select>
                    </div>
                    <br>
                    <button type="reset">limpar</button><button type="submit">Enviar</button>
                </fieldset>
            </form>
        </font>
    </section>
</body>

</html>
